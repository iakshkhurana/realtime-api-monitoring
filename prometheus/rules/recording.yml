groups:
  - name: api-recording
    interval: 5s
    rules:
      - record: api:http_requests:rate1m
        expr: sum(rate(http_requests_total{job="api"}[1m]))

      - record: api:http_errors:ratio_rate1m
        expr: |
          sum(rate(http_requests_total{job="api", status_code=~"5.."}[1m]))
          /
          clamp_min(sum(rate(http_requests_total{job="api"}[1m])), 1e-9)

      - record: api:http_request_duration_seconds:p95_1m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="api"}[1m]))
          )
